<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Incident Console{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <header>
    <span class="logo">⛑ incident<span class="accent">pilot</span></span>
    <nav>
      <a href="/" {% if page == 'incidents' %}class="active"{% endif %}>Incidents</a>
      <a href="/chat" {% if page == 'chat' %}class="active"{% endif %}>Ask Holmes</a>
    </nav>
    <span class="cluster">cluster: {{ cluster_name }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
