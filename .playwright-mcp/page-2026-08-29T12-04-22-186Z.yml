      - heading "Why hybrid instead of a single do-everything agent?" [level=3] [ref=f1e70]
      - paragraph [ref=f1e71]:
        - strong [ref=f1e72]: "Reliability:"
        - text: detection must never miss an event; rule-based watchers are deterministic and cheap, while an LLM in the detection path would add latency, cost, and hallucination risk to the one stage that must be exact.
        - strong [ref=f1e73]: "Cost & latency:"
        - text: the LLM is invoked only when a human asks "why?" — not on every cluster event.
        - strong [ref=f1e74]: "Safety:"
        - text: mutations go through exactly one audited code path with human approval; the LLM can read everything but change nothing. Each actor does what its substrate is best at.
