        - listitem [ref=f1e108]: The console appends a formatting hint (bold one-line summary first, tables for resources) and forwards to Holmes with the active provider's model.
        - listitem [ref=f1e109]: Holmes runs the same tool loop against the live cluster — the answer reflects reality at that moment, not a cached index.
        - listitem [ref=f1e110]: The response is Markdown-rendered, sanitized, badge-decorated, and appended to the chat log as a rich card.
      - heading "Flow C — logs with AI explanation" [level=3] [ref=f1e111]
