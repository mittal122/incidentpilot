      - heading "2. Application Flow" [level=2] [ref=f1e76]
      - heading "Flow A — an incident happens (push path)" [level=3] [ref=f1e77]
      - list [ref=f1e78]:
        - listitem [ref=f1e79]:
          - text: A pod in any namespace fails — e.g. crashes on startup because its database password is wrong → Kubernetes marks it
          - generic [ref=f1e80]: CrashLoopBackOff
          - text: .
        - listitem [ref=f1e81]:
          - strong [ref=f1e82]: "Detection:"
          - text: Robusta's kubewatch sees the pod-state change within seconds (Prometheus alert rules fire in parallel for metric-based conditions and reach Robusta through Alertmanager).
        - listitem [ref=f1e83]:
          - strong [ref=f1e84]: "Enrichment:"
          - text: the Robusta runner builds a
          - emphasis [ref=f1e85]: finding
          - text: ": title, severity, subject (namespace/pod/kind), recent logs, events."
        - listitem [ref=f1e86]:
          - strong [ref=f1e87]: "Fan-out:"
          - text: the finding goes to Slack
          - emphasis [ref=f1e88]: and
          - text: is POSTed as JSON to the console's
          - code [ref=f1e89]: /api/ingest
          - text: ; the console stores it in SQLite.
        - listitem [ref=f1e90]:
          - strong [ref=f1e91]: "Display:"
          - text: the Overview card grid and Incidents table (htmx, polling every 5–10 s) show the incident — critical namespaces sort first.
        - listitem [ref=f1e92]:
          - strong [ref=f1e93]: "Investigation (on demand):"
          - text: the user clicks
          - emphasis [ref=f1e94]: Investigate with Holmes
          - text: . The console composes a prompt from the stored finding and calls Holmes'
          - code [ref=f1e95]: /api/chat
          - text: with the active model alias.
        - listitem [ref=f1e96]:
          - strong [ref=f1e97]: "Agentic loop:"
          - text: "Holmes' LLM iterates: list pods → describe pod → fetch logs → (optionally) query Prometheus/Loki — each round is one LLM call choosing the next tool — then writes a root-cause analysis in Markdown."
        - listitem [ref=f1e98]:
          - strong [ref=f1e99]: "Rendering:"
          - text: the console converts the Markdown to sanitized HTML (tables, code, colored status chips) and stores the analysis with the incident.
        - listitem [ref=f1e100]:
          - strong [ref=f1e101]: "Remediation:"
          - text: if appropriate, the user clicks
          - emphasis [ref=f1e102]: "Approve: restart pod"
          - text: . The console validates the names against a strict regex and runs
          - code [ref=f1e103]: kubectl delete pod
          - text: ; the pod's Deployment recreates it. Nothing is ever executed without that click (outside the one whitelisted test-namespace playbook).
      - heading "Flow B — the user asks a question (pull path)" [level=3] [ref=f1e104]
      - list [ref=f1e105]:
        - listitem [ref=f1e106]:
          - text: User types into
          - emphasis [ref=f1e107]: Ask Holmes
