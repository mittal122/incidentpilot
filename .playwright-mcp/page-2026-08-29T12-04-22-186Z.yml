    - generic [ref=f1e252]:
      - heading "5. Agentic Framework" [level=2] [ref=f1e253]
      - paragraph [ref=f1e254]:
        - strong [ref=f1e255]: No external agentic framework
        - text: — no LangChain, LangGraph, CrewAI, or AutoGen anywhere in the stack.
      - heading "What we use instead" [level=3] [ref=f1e256]
      - paragraph [ref=f1e257]:
        - text: HolmesGPT ships its
        - strong [ref=f1e258]: own purpose-built agentic loop
        - text: (vendored in
        - code [ref=f1e259]: vendor/holmesgpt
        - text: "): litellm for provider-agnostic LLM calls, a curated registry of DevOps toolsets (kubectl, Prometheus, Loki, bash) exposed to the model as function-calling tools, iterative call→observe→call orchestration with token budgeting, and Kubernetes-aware system prompts refined by the Robusta team against real incidents."
      - heading "Why not LangChain / CrewAI?" [level=3] [ref=f1e260]
      - paragraph [ref=f1e261]:
        - text: Three reasons.
        - strong [ref=f1e262]: "(1) Nothing missing:"
        - text: the loop Holmes implements — tool selection, iteration, structured output — is exactly the part frameworks abstract, already done, domain-tuned.
        - strong [ref=f1e263]: "(2) Fewer layers:"
        - text: frameworks add their own abstractions (chains, graphs, crews) between you and the LLM call; when an investigation misbehaves we read one loop in one file, not framework internals.
        - strong [ref=f1e264]: "(3) Single-agent reality:"
        - text: multi-agent frameworks earn their complexity when multiple LLM agents negotiate; our architecture intentionally has one reasoning agent surrounded by deterministic actors — a message-passing framework would be scaffolding with nothing to scaffold.
      - paragraph [ref=f1e265]: "Console-side \"orchestration\" is deliberately plain code: a webhook handler, an HTTP proxy, and a rendering pipeline — readable in one sitting."
